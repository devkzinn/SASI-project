<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SASI UFRRJ</title>
    <link rel="icon" type="image/png" href="imagens/rural_logo.png">
    <link rel="stylesheet" href="css/telaLoguin.css">
</head>
<body>
    <header>
      <a class="brand" href="html/telaGaleria.html" aria-label="SASI UFRRJ — abrir galeria">
        <img class="logo" src="imagens/rural_logo.png" alt="">
        <span>
          <strong>SASI UFRRJ</strong>
          <small>Semana Acadêmica de Sistemas de Informação</small>
        </span>
      </a>
        <nav aria-label="Navegação principal">
          <a class="gallery-link" href="html/telaGaleria.html">
            Galeria
            <span aria-hidden="true">
              <svg viewBox="0 0 20 20" focusable="false">
                <path d="M4 10h10m-4-4 4 4-4 4"></path>
              </svg>
            </span>
          </a>
      </nav>
    </header>

<main>
  <section>
    <h1>Cadastro de Participante</h1>
    <p>Preencha os seus dados para garantir presença nas atividades do ICE.</p>
    
    <form action="#" method="get">
      <fieldset>
        <legend>Dados Pessoais e Acadêmicos</legend>
        
        <label for="nome">Nome Completo:</label><br>
        <input type="text" id="nome" placeholder="Ex: João da Silva" required><br><br>

        <label for="email">E-mail Acadêmico / Principal:</label><br>
        <input type="email" id="email" placeholder="aluno@ufrrj.br" required><br><br>

        <label for="matricula">Matrícula (se discente UFRRJ):</label><br>
        <input type="text" id="matricula" placeholder="202X000000"><br><br>
      </fieldset>

      <fieldset>
        <legend>Acesso</legend>
        <label for="senha">Senha:</label><br>
        <input type="password" id="senha" required><br><br>
        
        <label for="confirma_senha">Confirme a Senha:</label><br>
        <input type="password" id="confirma_senha" required>
      </fieldset>

      <br>
      <div class="botoes-inscricao">
        <button type="submit" formaction="html/telaDiscente.html" formmethod="get">Realizar inscrição como Discente</button>
        <button type="submit" formaction="html/telaPalestrante.html" formmethod="get">Realizar inscrição como Palestrante</button>
        <button type="submit" formaction="html/telaOrganizacao.html" formmethod="get">Realizar inscrição como Comissão organizadora / Secretaria</button>
      </div>
    </form>
  </section>
</main>

<footer>
  <p>&copy; SASI UFRRJ — Instituto de Ciências Exatas (ICE) / Departamento de Computação (DCOMP)</p>
</footer>
</body>
</html>
